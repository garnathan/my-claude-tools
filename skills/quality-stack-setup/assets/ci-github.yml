# GitHub Actions CI — the UNBYPASSABLE BACKSTOP. Copy to .github/workflows/ci.yml.
# Runs on every PR into `dev` or `main`.
#
# Parity by construction: this job runs `just verify` — the EXACT recipe the
# pre-push git hook runs (see lefthook.yml + justfile). Same commands, same
# project-pinned tools → if it passed locally on push, it passes here. The
# local hooks can be skipped (--no-verify, lefthook not installed); a required
# status check on this workflow cannot. That's the point of running it again.
#
# CUSTOMIZE:
#  - Shows Node + pnpm. For Python, add an `astral-sh/setup-uv` step + `uv sync`.
#    For Rust, add `dtolnay/rust-toolchain@stable`. `just verify` already runs
#    each language's tools when its manifest is present.
#  - `build` is intentionally NOT in `just verify` (too heavy for every push) —
#    it runs here only. Drop it if there's nothing to build.
#  - After this lands, make the `ci` job a REQUIRED status check in branch protection.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]   # keep a fresh status on the base for required-check enforcement

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # Python: add `astral-sh/setup-uv@v6` above and `uv sync --frozen` here.
        # Rust:   add `dtolnay/rust-toolchain@stable` above.

      # The single source of truth — identical to the pre-push hook.
      - name: Verify (format-check + lint + typecheck + test + coverage)
        run: just verify

      - name: Build
        run: pnpm -r build
